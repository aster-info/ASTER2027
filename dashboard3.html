<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- =====================================================================
         RUBRIQUE 1 : MÉTADONNÉES, CHART.JS ET TITRE
         ===================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ASTER</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <style>
        /* =====================================================================
           RUBRIQUE 2 : VARIABLES ET STYLES GÉNÉRAUX
           ===================================================================== */
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #0284c7;
            --primary-dark: #0f2942;
            --green: #10b981;
            --green-soft: #dcfce7;
            --green-text: #15803d;
            --red: #ef4444;
            --red-soft: #fee2e2;
            --red-text: #b91c1c;
            --blue: #29b6f6;
            --blue-soft: #e0f2fe;
            --blue-text: #0369a1;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 28px 18px 56px;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        /* =====================================================================
           RUBRIQUE 3 : EN-TÊTE ET BARRE D'ACTIONS
           ===================================================================== */
        .top-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 26px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.08));
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: transform 0.15s, background-color 0.2s;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover { background: #0369a1; }

        .btn-ghost {
            background: #f1f5f9;
            color: var(--primary-dark);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: #e2e8f0; }

        /* =====================================================================
           RUBRIQUE 4 : CARTES KPI CLIQUABLES (OUVRANT LA FENÊTRE MODALE)
           ===================================================================== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: #94a3b8;
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.1);
        }

        .kpi-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
        }

        .kpi-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        .kpi-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
        }

        .kpi-present .kpi-value { color: var(--green-text); }
        .kpi-present .kpi-badge { background: var(--green-soft); color: var(--green-text); }

        .kpi-sorti .kpi-value { color: var(--red-text); }
        .kpi-sorti .kpi-badge { background: var(--red-soft); color: var(--red-text); }

        .kpi-inscrit .kpi-value { color: var(--blue-text); }
        .kpi-inscrit .kpi-badge { background: var(--blue-soft); color: var(--blue-text); }

        .kpi-total .kpi-value { color: var(--primary-dark); }
        .kpi-total .kpi-badge { background: #e0e7ff; color: #3730a3; }

        /* =====================================================================
           RUBRIQUE 5 : GRILLE DES GRAPHIQUES ANALYTIQUES
           ===================================================================== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 350px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .card-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 4px
