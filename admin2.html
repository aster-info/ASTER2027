<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Encodage UTF-8 pour supporter les accents et caractères spéciaux français -->
    <meta charset="UTF-8">
    <!-- Adaptation de l'affichage sur mobile, tablette et ordinateur -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titre affiché dans l'onglet du navigateur -->
    <title>Administration - ASTER</title>

    <style>
        /* =====================================================================
           RUBRIQUE 1 : STYLE GLOBAL ET MISE EN PAGE DE LA PAGE
           ===================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9; /* Fond gris clair apaisant */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 48px;
        }

        /* =====================================================================
           RUBRIQUE 2 : EN-TÊTE (LOGO ASTER + TITRE "ADMINISTRATION")
           ===================================================================== */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
        }

        .header-logo {
            width: 148px;
            height: 148px;
            object-fit: contain; /* Conserve les proportions du logo sans le couper */
            margin-bottom: 14px;
            filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.08));
        }

        .header-title {
            font-size: 32px;
            font-weight: 700;
            color: #0f2942;
            letter-spacing: -0.02em;
        }

        /* =====================================================================
           RUBRIQUE 3 : BARRE DES COMPTEURS EN PILULES (In / Out / Inscrits)
           ===================================================================== */
        .counters-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .counter-pill {
            background: #ffffff;
            border-radius: 999px; /* Forme pilule */
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
            border: 1px solid #eef2f6;
            font-size: 14px;
            font-weight: 700;
            color: #0f2942;
        }

        .badge-count {
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            line-height: 1.2;
        }

        .badge-in {
            background-color: #10b981; /* Vert : membres actuellement présents */
        }

        .badge-out {
            background-color: #ef4444; /* Rouge : membres sortis */
        }

        .badge-total {
            background-color: #29b6f6; /* Bleu : total des inscrits */
        }

        /* =====================================================================
           RUBRIQUE 4 : CARTE PRINCIPALE, RECHERCHE ET LISTE DES MEMBRES
           ===================================================================== */
        .main-card {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.07);
            border: 1px solid #eef2f6;
        }

        .search-box {
            margin-bottom: 18px;
        }

        .search-input {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            color: #334155;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
        }

        /* Zone scrollable contenant toutes les lignes de membres */
        .members-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 430px; /* Limite la hauteur pour garder une barre de défilement propre */
            overflow-y: auto;
            padding-right: 6px;
        }

        .members-list::-webkit-scrollbar {
            width: 8px;
        }

        .members-list::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .members-list::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
        }

        /* Carte / ligne individuelle d'un membre */
        .member-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.15s, border-color 0.15s;
        }

        .member-row:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .member-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        /* Photo de profil ronde du membre dans la liste */
        .member-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover; /* Recadre proprement le visage sans déformation */
            flex-shrink: 0;
            background: #ffffff;
            border: 2px solid #e2e8f0;
        }

        .member-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .member-name {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-id {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            flex-shrink: 0;
            margin-left: 12px;
        }

        /* Badges visuels selon le statut (Présent / Sorti / Inscrit) */
        .status-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 8px;
            line-height: 1.2;
        }

        .status-present {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-sorti {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .status-inscrit {
            background-color: #f1f5f9;
            color: #475569;
        }

        /* Heure affichée sous le badge de statut */
        .member-time {
            font-size: 13px;
            font-weight: 700;
            color: #0f766e;
            font-variant-numeric: tabular-nums; /* Alignement vertical net des chiffres */
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 32px 12px;
            font-size: 14px;
        }

        /* =====================================================================
           RUBRIQUE 5 : FENÊTRE MODALE DE DÉTAIL DU MEMBRE
           ===================================================================== */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(3px);
            display: none; /* Masquée tant qu'aucun membre n'est cliqué */
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-backdrop.active {
            display: flex; /* Affichée lorsque la classe "active" est ajoutée */
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 26px;
            padding: 28px 24px 24px;
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Grande photo ronde du membre dans la fenêtre modale */
        .modal-photo {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #e0f2fe;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
            margin-bottom: 14px;
            background: #ffffff;
        }

        .modal-name {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .modal-id {
            font-size: 13px;
            font-weight: 600;
            color: #0284c7;
            background: #f0f9ff;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 8px;
        }

        .modal-titre {
            font-size: 15px;
            font-weight: 700;
            color: #0284c7;
            margin-bottom: 20px;
        }

        .modal-details {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
            text-align: left;
            font-size: 14px;
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .modal-label {
            color: #64748b;
            font-weight: 500;
        }

        .modal-value {
            color: #0f172a;
            font-weight: 700;
            text-align: right;
            word-break: break-word;
        }

        .modal-close-btn {
            width: 100%;
            padding: 13px;
            border: none;
