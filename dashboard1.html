<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- =====================================================================
         RUBRIQUE 1 : MÉTADONNÉES, CHART.JS ET TITRE
         ===================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ASTER</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <style>
        /* =====================================================================
           RUBRIQUE 2 : VARIABLES ET STYLES GÉNÉRAUX
           ===================================================================== */
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #0284c7;
            --primary-dark: #0f2942;
            --green: #10b981;
            --green-soft: #dcfce7;
            --green-text: #15803d;
            --red: #ef4444;
            --red-soft: #fee2e2;
            --red-text: #b91c1c;
            --blue: #29b6f6;
            --blue-soft: #e0f2fe;
            --blue-text: #0369a1;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 28px 18px 56px;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        /* =====================================================================
           RUBRIQUE 3 : EN-TÊTE ET BARRE D'ACTIONS
           ===================================================================== */
        .top-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px 26px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-logo {
            width: 78px;
            height: 78px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.08));
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 9px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: transform 0.15s, background-color 0.2s;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover { background: #0369a1; }

        .btn-ghost {
            background: #f1f5f9;
            color: var(--primary-dark);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: #e2e8f0; }

        /* =====================================================================
           RUBRIQUE 4 : CARTES KPI CLIQUABLES (OUVRANT LA FENÊTRE MODALE)
           ===================================================================== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: #94a3b8;
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.1);
        }

        .kpi-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.1;
        }

        .kpi-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        .kpi-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
        }

        .kpi-present .kpi-value { color: var(--green-text); }
        .kpi-present .kpi-badge { background: var(--green-soft); color: var(--green-text); }

        .kpi-sorti .kpi-value { color: var(--red-text); }
        .kpi-sorti .kpi-badge { background: var(--red-soft); color: var(--red-text); }

        .kpi-inscrit .kpi-value { color: var(--blue-text); }
        .kpi-inscrit .kpi-badge { background: var(--blue-soft); color: var(--blue-text); }

        .kpi-total .kpi-value { color: var(--primary-dark); }
        .kpi-total .kpi-badge { background: #e0e7ff; color: #3730a3; }

        /* =====================================================================
           RUBRIQUE 5 : GRILLE DES GRAPHIQUES ANALYTIQUES
           ===================================================================== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            min-height: 350px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .card-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
        }

        .chart-box {
            position: relative;
            flex: 1;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =====================================================================
           RUBRIQUE 6 : SYNTHÈSE DES INSTITUTIONS & LISTE FILTRABLE
           ===================================================================== */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1.35fr;
            gap: 20px;
        }

        @media (max-width: 960px) {
            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px 24px;
            box-shadow: var(--shadow);
        }

        .inst-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 410px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .inst-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .inst-item:hover {
            background: #f0f9ff;
            border-color: #bae6fd;
        }

        .inst-name {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inst-count {
            background: var(--blue-soft);
            color: var(--blue-text);
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-input, .select-filter {
            padding: 10px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            color: #334155;
            background: #ffffff;
            outline: none;
        }

        .search-input { flex: 1; min-width: 180px; }
        .search-input:focus, .select-filter:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14);
        }

        .members-table-wrap {
            max-height: 350px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        th {
            text-align: left;
            padding: 10px 10px;
            color: var(--muted);
            font-weight: 700;
            border-bottom: 1.5px solid var(--border);
            position: sticky;
            top: 0;
            background: #ffffff;
        }

        td {
            padding: 10px 10px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tr:hover td { background: #f8fafc; }

        .avatar-sm {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            vertical-align: middle;
            margin-right: 8px;
        }

        .status-badge {
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 8px;
            display: inline-block;
        }

        .status-present { background: var(--green-soft); color: var(--green-text); }
        .status-sorti { background: var(--red-soft); color: var(--red-text); }
        .status-inscrit { background: var(--blue-soft); color: var(--blue-text); }

        .empty-msg {
            text-align: center;
            color: var(--muted);
            padding: 28px 12px;
            font-size: 14px;
        }

        /* =====================================================================
           RUBRIQUE 7 : FENÊTRE MODALE DE DÉTAILS POUR LES 4 ONGLETS / KPI
           ===================================================================== */
        .kpi-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 2000;
        }

        .kpi-modal-backdrop.active {
            display: flex;
        }

        .kpi-modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 660px;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: 0 24px 55px rgba(15, 23, 42, 0.28);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .kpi-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }

        .kpi-modal-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kpi-modal-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .kpi-modal-count {
            font-size: 12.5px;
            font-weight: 800;
            padding: 4px 11px;
            border-radius: 999px;
            background: var(--blue-soft);
            color: var(--blue-text);
        }

        .kpi-modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .kpi-modal-close:hover {
            background: #f1f5f9;
        }

        .kpi-modal-body {
            padding: 18px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
        }

        .modal-member-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .modal-member-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 2px solid #cbd5e1;
            background: #ffffff;
            flex-shrink: 0;
        }

        .modal-member-name {
            font-size: 14.5px;
            font-weight: 700;
            color: #0f172a;
        }

        .modal-member-meta {
            font-size: 12.5px;
            color: var(--muted);
            margin-top: 2px;
        }

        .modal-member-right {
            text-align: right;
            flex-shrink: 0;
        }

        .modal-member-time {
            font-size: 12px;
            font-weight: 700;
            margin-top: 4px;
            font
